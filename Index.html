<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculus Homework Help</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; text-align: center; padding: 50px; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        input { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Enter URL to open past the firewall:</h2>
        <!-- Simple hidden proxy portal -->
        <input type="text" id="targetUrl" value="instagram.com">
        <button onclick="launchProxy()">Unblock</button>
    </div>

    <script>
        function launchProxy() {
            var target = document.getElementById("targetUrl").value;
            if (target) {
                // Routes the site securely via Google Translate's infrastructure 
                var proxyUrl = "https://google.com" + target;
                window.open(proxyUrl, '_blank');
            }
        }
    </script>
</body>
</html>
